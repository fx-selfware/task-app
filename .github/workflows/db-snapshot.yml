# Manual one-off: dump the production Postgres (running in Docker on the VM)
# and expose it as a short-lived workflow artifact. Used for the v2 rewrite's
# Postgres -> SQLite data migration; delete this workflow after cutover.
name: DB Snapshot

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Dump production Postgres over SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/key -o BatchMode=yes "$VM_USER@$VM_HOST" \
            "cd /app/task-app && docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T db sh -c 'pg_dump -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" --format=custom'" \
            > taskapp.dump
          test -s taskapp.dump
          ls -la taskapp.dump

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskapp-pg-snapshot
          path: taskapp.dump
          retention-days: 1
