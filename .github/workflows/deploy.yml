name: Test & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.env.example'
      - '.github/**'
      - '.gitignore'
      - 'docker-compose.override.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run backend tests
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm backend-test

      - name: Start stack for E2E
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d --wait -V

      - name: Install Playwright
        run: npm --prefix e2e install && npx --prefix e2e playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm --prefix e2e test
        env:
          BASE_URL: http://localhost:8099

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Check for deploy-worthy changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'backend/**'
              - 'frontend/**'
              - 'nginx/**'
              - 'Caddyfile'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'

      - name: Deploy to Azure VM
        if: steps.filter.outputs.app == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /app/task-app
            git pull origin main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
            echo "Deploy complete"
