name: Test & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.env.example'
      - '.gitignore'
      - 'docker-compose.override.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run backend tests
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm backend-test

      - name: Start stack for E2E
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d --wait -V

      - name: Install Playwright
        run: npm --prefix e2e install && npx --prefix e2e playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm --prefix e2e test
        env:
          BASE_URL: http://localhost:8099

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Check for deploy-worthy changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'backend/**'
              - 'frontend/**'
              - 'nginx/**'
              - 'Caddyfile'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.app == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.filter.outputs.app == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        if: steps.filter.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: true
          tags: ghcr.io/fanxia0404/task-app-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        if: steps.filter.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: true
          tags: ghcr.io/fanxia0404/task-app-frontend:latest
          build-args: COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure VM
        if: steps.filter.outputs.app == 'true'
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /app/task-app
            git pull origin main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend frontend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io
            echo "Deploy complete"
