name: Test & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.env.example'
      - '.gitignore'
      - 'docker-compose.override.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.filter.outputs.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Check for deploy-worthy changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'backend/**'
              - 'frontend/**'
              - 'nginx/**'
              - 'Caddyfile'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - '.github/workflows/**'

      - name: Run backend tests & build E2E stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm backend-test &
          BDD_PID=$!
          docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d --wait -V
          wait $BDD_PID
        env:
          COMMIT_SHA: ${{ github.sha }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright
        run: npm --prefix e2e install && npx --prefix e2e playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm --prefix e2e test
        env:
          BASE_URL: http://localhost:8099

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && needs.test.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: production
          push: true
          tags: ghcr.io/fanxia0404/task-app-${{ matrix.service }}:latest
          build-args: ${{ matrix.service == 'frontend' && format('COMMIT_SHA={0}', github.sha) || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && needs.test.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /app/task-app
            git pull origin main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend frontend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io
            echo "Deploy complete"
