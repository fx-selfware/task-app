# Test environment. Extends docker-compose.yml.
#
# Backend BDD:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm backend-test
#
# E2E (clean DB, port 8099):
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d --wait -V
#   npm --prefix e2e install && BASE_URL=http://localhost:8099 npm --prefix e2e test
#   docker compose -f docker-compose.yml -f docker-compose.test.yml down

services:
  # Overrides for the E2E app stack
  backend:
    environment:
      JWT_SECRET: test-jwt-secret-at-least-32-chars!
      NODE_ENV: test
      COOKIE_SECURE: 'false'

  frontend:
    ports:
      - '8099:80'

  # Isolated DB for backend BDD tests (separate from the E2E app DB)
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskapp_test
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: testpassword
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskapp -d taskapp_test']
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend BDD test runner — use with `docker compose run --rm backend-test`
  backend-test:
    build:
      context: ./backend
      target: dev
      args:
        PROXY_CA_B64: ${PROXY_CA_CERT_B64:-}
        PROXY_HOST: ${DOCKER_PROXY_HOST:-}
    environment:
      DATABASE_URL: postgresql://taskapp:testpassword@db-test:5432/taskapp_test
      JWT_SECRET: test-jwt-secret-at-least-16-chars
      NODE_ENV: test
      COOKIE_SECURE: 'false'
    depends_on:
      db-test:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm test"
