services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskapp}
      POSTGRES_USER: ${POSTGRES_USER:-taskapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-taskapp} -d ${POSTGRES_DB:-taskapp}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: production
      args:
        PROXY_CA_B64: ${PROXY_CA_CERT_B64:-}
        PROXY_HOST: ${DOCKER_PROXY_HOST:-}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://taskapp:changeme@db:5432/taskapp}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret}
      NODE_ENV: ${NODE_ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/api/auth/me',r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        PROXY_CA_B64: ${PROXY_CA_CERT_B64:-}
        PROXY_HOST: ${DOCKER_PROXY_HOST:-}
        COMMIT_SHA: ${COMMIT_SHA:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

